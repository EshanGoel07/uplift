[project]
name = "uplift"
version = "0.1.0"
description = "Prove whether a coding-agent setup actually helps on a repo's own past bugs, and prune what doesn't."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
report = ["matplotlib>=3.8"]

[project.scripts]
uplift = "uplift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uplift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
